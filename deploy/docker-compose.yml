version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: vl-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-123456}
      MYSQL_DATABASE: virtual_learn
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: vl-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: virtual_learn
      DB_USER: root
      DB_PASS: ${DB_PASS:-123456}
      UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
    ports:
      - "9001:9001"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    container_name: vl-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
  uploads_data:
