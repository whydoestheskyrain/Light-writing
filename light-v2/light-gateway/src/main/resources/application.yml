server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: light-gateway
  config:
    import:
      # optional: 前缀保证 Nacos 不可达或 dataId 不存在时不阻断启动（本地裸跑/单元测试也能起）
      - optional:nacos:${spring.application.name}.yml
      - optional:nacos:application-common.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        # 本地 Nacos 默认关闭鉴权：用户名留空即跳过登录；开启鉴权时用环境变量注入
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        enabled: ${NACOS_ENABLED:true}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
      # 配置中心：dataId = 服务名.yml（私有）+ application-common.yml（全服务共享）
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        file-extension: yml
    loadbalancer:
      enabled: true
    # Sentinel 网关限流降级响应（SentinelGatewayFilter 触发流控时返回）
    sentinel:
      eager: true # 启动即初始化 Sentinel，而不是等首个请求
      scg:
        fallback:
          mode: response
          response-status: 429
          content-type: application/json
          response-body: '{"code":429,"msg":"请求过于频繁，请稍后再试"}'
      # 规则外置到 Nacos（SENTINEL_GROUP）：控制台改 JSON 发布后秒级生效，无需重启网关
      datasource:
        # 网关流控规则（按路由 ID 限 QPS）
        gw-flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            username: ${NACOS_USERNAME:}
            password: ${NACOS_PASSWORD:}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-gw-flow.json
            data-type: json
            rule-type: gw-flow
        # 熔断降级规则（按 SpringCloudCircuitBreaker 过滤器的 name）
        degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            username: ${NACOS_USERNAME:}
            password: ${NACOS_PASSWORD:}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade.json
            data-type: json
            rule-type: degrade
    # Spring Cloud Gateway 2025.1+ 路由配置
    # 属性前缀必须完整：spring.cloud.gateway.server.webflux.routes
    #  1) 旧版 spring.cloud.gateway.routes 在 2025.1 已被静默忽略（拆出了 server-webflux / server-webmvc）
    #  2) 该块必须挂在 spring.cloud 下。若误缩进到 security 等其它根节点，配置会被整体忽略、网关加载到 0 条路由
    # uri 用 lb://服务名，由 Nacos 注册表 + Spring Cloud LoadBalancer 解析到具体实例。
    # 每个路由挂 SpringCloudCircuitBreaker 过滤器：下游异常比例超阈值后熔断，fallbackUri 转发到本地降级响应。
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              # 默认走 Nacos + LoadBalancer；测试通过 identity_SERVICE_URL 占位符指向临时 HTTP 下游
              uri: ${identity_SERVICE_URL:lb://light-identity-service}
              predicates:
                - Path=/api/identity/**
              filters:
                - name: SpringCloudCircuitBreaker
                  args:
                    name: identityServiceCB
                    fallbackUri: forward:/fallback/identity
            - id: knowledge-service
              uri: ${knowledge_SERVICE_URL:lb://light-knowledge-service}
              predicates:
                - Path=/api/knowledge/**,/api/module/**,/api/entry/**
              filters:
                - name: SpringCloudCircuitBreaker
                  args:
                    name: knowledgeServiceCB
                    fallbackUri: forward:/fallback/knowledge
            - id: file-service
              uri: ${file_SERVICE_URL:lb://light-file-service}
              predicates:
                - Path=/api/file/**,/api/upload/**
              filters:
                - name: SpringCloudCircuitBreaker
                  args:
                    name: fileServiceCB
                    fallbackUri: forward:/fallback/file
            - id: learning-service
              uri: ${learning_SERVICE_URL:lb://light-learning-service}
              predicates:
                - Path=/api/learning/**
              filters:
                - name: SpringCloudCircuitBreaker
                  args:
                    name: learningServiceCB
                    fallbackUri: forward:/fallback/learning
  jackson:
    time-zone: GMT+8

security:
  jwt:
    secret: ${JWT_SECRET:light-v2-development-secret-change-me-2026}

# Actuator：网关本身也要被监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.light: debug
    org.springframework.cloud.gateway: info
