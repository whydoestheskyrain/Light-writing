﻿# 知识管理平台 2.0 —— 本地全栈基础设施 + 微服务
# 一键启动：docker compose up -d --build
# 停止：    docker compose down
# 清数据：  docker compose down -v
#
# 容器互访规则：容器内访问其它容器一律用【服务名】而不是 127.0.0.1。
# 127.0.0.1 在容器内指向容器自身，这是"本地能跑、进 Docker 全挂"的头号原因。
# 所以下面统一通过环境变量覆盖各服务 yml 的默认值：
#   DB_HOST=mysql        -> spring.datasource
#   NACOS_SERVER_ADDR=nacos:8848 -> spring.cloud.nacos.discovery
services:
  mysql:
    image: mysql:8.4
    container_name: light-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-light_v2}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      # utf8mb4 支持完整 emoji； innodb_buffer_pool_size 给小开发机留小点
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - light-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: light-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-only-password}
    # Compose 在数组形式下不会经过 shell 展开，使用 Compose 变量插值传入实际密码。
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-dev-only-password}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - light-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-dev-only-password} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 服务注册与发现中心。gateway 的 lb://服务名 路由依赖它把请求解析到具体实例。
  nacos:
    # 必须 3.x：spring-cloud-alibaba 2025.1 自带 nacos-client 3.1.1，其配置模块走 v3 接口；
    # 对接 2.x 服务端时 config 查询会静默返回空（注册不受影响）。3.x 服务端向下兼容老客户端。
    image: nacos/nacos-server:v3.2.4
    container_name: light-nacos
    restart: unless-stopped
    environment:
      MODE: standalone          # 单机模式，内嵌 derby 存储，开发够用
      PREFER_HOST_MODE: hostname
      # Nacos 3.x 鉴权拆成三层：server（SDK gRPC）/ admin（管理 API）/ console（控制台 API）
      # 开发环境全部关闭；上生产时改为 true 并配置 token、identity 白名单
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_ADMIN_ENABLE: "false"
      NACOS_AUTH_CONSOLE_ENABLE: "false"
      # 镜像启动脚本即使鉴权关闭也强制校验该变量存在，给占位值即可（鉴权关闭时不会使用）
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-VkFDS0FfREVWX1RPS0VOWElOR1RPTUdFTkVFU09MTFlVVFNIT1VTTERCRVNFVE9SQUdF}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-dev-identity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-dev-identity-value}
      TZ: ${TZ:-Asia/Shanghai}
    # 关键：Nacos 单机模式冷启动需 30-60s，期间 gRPC 端口未就绪。
    # 用就绪探针让应用等到真正可服务再启动，否则注册/拉配置会在 STARTING 期失败。
    healthcheck:
      # Nacos 3.x 已移除 v1 readiness 端点，用 v3 core/state 判断服务就绪
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v3/admin/core/state | grep -q '\"code\":0' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Nacos 3.x 端口分工：8080 是 Web 控制台（映射到宿主 8088，宿主 8080 已给网关）；
    # 8848 是服务端 HTTP API；9848/9849 是客户端 gRPC。
    ports:
      - "8088:8080"
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - light-net

  # ===== 业务微服务：只暴露 gateway 到宿主机，其余仅在内网互通 =====
  # 只有 gateway 对外发布端口，符合"单一入口"的微服务惯例，也避免和宿主机端口冲突。
  light-gateway:
    build:
      context: .
      dockerfile: light-gateway/Dockerfile
    container_name: light-gateway
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      GATEWAY_PORT: 8080
      NACOS_SERVER_ADDR: nacos:8848
      # Nacos 默认关闭鉴权，不传用户名；开启鉴权时在 .env 配置 NACOS_USERNAME/NACOS_PASSWORD
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-light-v2-development-secret-change-me-2026}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "8080:8080"
    networks:
      - light-net

  light-identity-service:
    build:
      context: .
      dockerfile: light-identity-service/Dockerfile
    container_name: light-identity-service
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-light_v2}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${MYSQL_ROOT_PASSWORD:-root123}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-light-v2-development-secret-change-me-2026}
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - light-net

  light-knowledge-service:
    build:
      context: .
      dockerfile: light-knowledge-service/Dockerfile
    container_name: light-knowledge-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-light_v2}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${MYSQL_ROOT_PASSWORD:-root123}
      # Redis 缓存：容器内必须用服务名 redis，不能用 127.0.0.1
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-only-password}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-light-v2-development-secret-change-me-2026}
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - light-net

  light-file-service:
    build:
      context: .
      dockerfile: light-file-service/Dockerfile
    container_name: light-file-service
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-light_v2}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${MYSQL_ROOT_PASSWORD:-root123}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-light-v2-development-secret-change-me-2026}
      # 上传文件落盘位置，容器内路径，配合下面 volumes 持久化
      FILE_STORAGE_PATH: /app/data/uploads
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - uploads-data:/app/data/uploads
    networks:
      - light-net

  light-learning-service:
    build:
      context: .
      dockerfile: light-learning-service/Dockerfile
    container_name: light-learning-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-light_v2}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${MYSQL_ROOT_PASSWORD:-root123}
      # Redis 心跳增量：容器内必须用服务名 redis，不能用 127.0.0.1
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-only-password}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-light-v2-development-secret-change-me-2026}
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - light-net

  # ===== 监控：Prometheus 采集 + Grafana 展示 =====
  # Prometheus: http://localhost:9090 （Status > Targets 看抓取状态）
  # Grafana:    http://localhost:3000  （admin / admin，数据源已自动配好）
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: light-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - light-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: light-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - grafana-data:/var/lib/grafana
      # 启动时自动注入 Prometheus 数据源
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - light-net

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  uploads-data:
  prometheus-data:
  grafana-data:

networks:
  light-net:
    driver: bridge
